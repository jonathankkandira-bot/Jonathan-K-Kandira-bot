<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galaxy Blaster 3D</title>
<style>
body {
  margin: 0;
  background: radial-gradient(#142b55,#020510);
  color: white;
  font-family: Arial;
  text-align: center;
  overflow: hidden;
}
h1 { color: cyan; }
canvas {
  width: 100%;
  height: 65vh;
  display: block;
  touch-action: manipulation;
}
button {
  background: cyan;
  padding: 15px 35px;
  border: 0;
  border-radius: 12px;
  font-size: 18px;
}
</style>
</head>
<body>
<h1>🚀 GALAXY BLASTER</h1>
<h3>Score: <span id="score">0</span></h3>
<canvas id="game"></canvas>
<button onclick="startGame()">START GAME</button>
<p>Tap the flying targets to score!</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let score = 0;
let targets = [];
let playing = false;

function resize() {
  canvas.width = innerWidth;
  canvas.height = innerHeight * 0.65;
}
resize();
window.addEventListener("resize", resize);

function makeTarget() {
  targets.push({
    x: Math.random() * (canvas.width - 60) + 30,
    y: Math.random() * (canvas.height * 0.6) + 30,
    size: 18 + Math.random() * 18,
    speed: 1 + Math.random() * 2,
    phase: Math.random() * 6
  });
}

function draw() {
  if (!playing) return;
  ctx.clearRect(0,0,canvas.width,canvas.height);

  for(let i=0;i<50;i++){
    ctx.fillStyle="white";
    ctx.fillRect((i*97)%canvas.width,
      (i*137)%canvas.height,2,2);
  }

  targets.forEach((t)=>{
    t.y += t.speed;
    t.x += Math.sin(t.phase + Date.now()/500)*1.5;

    let glow = ctx.createRadialGradient(
      t.x,t.y,2,t.x,t.y,t.size*2
    );
    glow.addColorStop(0,"white");
    glow.addColorStop(0.3,"cyan");
    glow.addColorStop(1,"transparent");

    ctx.fillStyle=glow;
    ctx.beginPath();
    ctx.arc(t.x,t.y,t.size*2,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#00eaff";
    ctx.beginPath();
    ctx.arc(t.x,t.y,t.size,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="white";
    ctx.beginPath();
    ctx.arc(t.x,t.y,t.size/3,0,Math.PI*2);
    ctx.fill();
  });

  targets=targets.filter(t=>t.y<canvas.height+50);

  if(targets.length<5) makeTarget();

  requestAnimationFrame(draw);
}

canvas.addEventListener("pointerdown",function(e){
  if(!playing) return;
  let rect=canvas.getBoundingClientRect();
  let x=e.clientX-rect.left;
  let y=e.clientY-rect.top;

  for(let i=targets.length-1;i>=0;i--){
    let t=targets[i];
    if(Math.hypot(x-t.x,y-t.y)<t.size*2){
      targets.splice(i,1);
      score+=10;
      document.getElementById("score").textContent=score;
      break;
    }
  }
});

function startGame(){
  score=0;
  targets=[];
  playing=true;
  document.getElementById("score").textContent=score;
  for(let i=0;i<5;i++) makeTarget();
  draw();
}
</script>
</body>
</html>
